<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jaringan Komputer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            min-height: 100vh;
            color: white;
        }

        header {
            text-align: center;
            padding: 70px 20px 35px;
        }

        header .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        header p {
            color: #dbeafe;
            font-size: 17px;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: auto;
            padding: 20px 0 50px;
        }

        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 12px;
            font-size: 24px;
        }

        .card p {
            line-height: 1.7;
            color: #e0e7ff;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 14px 22px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        .telkom {
            background: #2563eb;
        }

        .youtube {
            background: #dc2626;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #bfdbfe;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 30px;
            }

            header .icon {
                font-size: 55px;
            }

            .card {
                padding: 22px;
            }

            .btn {
                display: block;
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="icon">🌐</div>
        <h1>Jaringan Komputer</h1>
        <p>Media pembelajaran dan sumber informasi</p>
    </header>

    <div class="container">

        <!-- Telkom University -->
        <div class="card">
            <h2>📚 Telkom University</h2>
            <p>
                Akses sumber pembelajaran jaringan komputer
                dari Telkom University.
            </p>

            <a
                href="https://share.google/vENbZgQcCoRmJgukJ"
                target="_blank"
                class="btn telkom">
                🔗 Buka Materi
            </a>
        </div>

        <!-- YouTube -->
        <div class="card">
            <h2>🎬 Video Pembelajaran</h2>
            <p>
                Tonton video pembelajaran mengenai jaringan komputer.
            </p>

            <a
                href="https://youtu.be/xT58k6AB7gk?si=Jc86NkzM3yL-YJ7O"
                target="_blank"
                class="btn youtube">
                ▶️ Tonton Vid
```
